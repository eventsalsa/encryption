name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -C kek/awskms ./...
          go vet -C kek/gcpkms ./...

      - name: golangci-lint (root)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

      - name: golangci-lint (kek/awskms)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: kek/awskms
          args: --config=../../.golangci.yml --timeout=5m

      - name: golangci-lint (kek/gcpkms)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: kek/gcpkms
          args: --config=../../.golangci.yml --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Run tests
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
          go test -C kek/awskms -race -count=1 ./...
          go test -C kek/gcpkms -race -count=1 ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Run integration tests
        run: go test -race -count=1 -tags=integration ./postgres/...
